name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run offline tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-zh-cn.ps1 -Action test -NoPause

      - name: Validate bat wrappers are pure ASCII
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Filter *.bat | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($bytes | Where-Object { $_ -gt 127 }) { $bad += $_.FullName }
          }
          if ($bad.Count -gt 0) {
            Write-Host "Non-ASCII bat files:"
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All bat files are pure ASCII."

      - name: Validate ps1 files carry UTF-8 BOM (PowerShell 5.1 compat)
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $b = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { $bad += $_.FullName }
          }
          if ($bad.Count -gt 0) {
            Write-Host "ps1 files missing UTF-8 BOM:"
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All ps1 files carry UTF-8 BOM."
